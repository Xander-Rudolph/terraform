name: SonarQube Scan with Local Server

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  review-pr:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:latest
        ports:
          - 9000:9000
        #TODO: this page works on the pod, but itsn't passing the github healthcheck
        # options: >-
        #   --health-cmd="curl -f http://localhost:9000/api/system/health"
        #   --health-cmd="curl -f http://localhost:9000/api/system/health"
        #   --health-interval=30s
        #   --health-timeout=10s
        #   --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for SonarQube to be ready
        run: |
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            echo "Waiting for SonarQube to start..."
            sleep 10
          done

      - name: Set up JDK # SonarQube scanner requires Java
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Run SonarQube Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          COVERAGE_ENABLED: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for PR decoration
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=my-project-key
            -Dsonar.sources=.
            -Dsonar.host.url=http://host.docker.internal:9000  # Assumes SonarQube is on localhost:9000
            -Dsonar.login=$SONAR_TOKEN
            -Dsonar.language=terraform
            {${{ env.COVERAGE_ENABLED }} == 'true' && '-Dsonar.coverage.exclusions=**/*' || ''}

      - name: Save scan results
        run: |
          mkdir -p .scannerwork
          docker cp sonarsource:/usr/src/.scannerwork/report-task.txt ./.scannerwork/scan-results.txt

      - name: Upload SonarQube results to artifact
        uses: actions/upload-artifact@v3
        with:
          name: sonar-results
          path: .scannerwork/scan-results.txt

