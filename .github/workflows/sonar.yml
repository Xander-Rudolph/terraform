name: SonarQube Scan with Local Server

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  review-pr:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:latest
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -s http://localhost:9000/api/system/status | grep -q 'UP'"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK # SonarQube scanner requires Java
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Run SonarQube - terraform
        env:
          # SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_TOKEN: 0123456
          COVERAGE_ENABLED: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for PR decoration
        uses: SonarSource/sonarqube-scan-action@v3.0.0
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository }}
            -Dsonar.sources=.
            -Dsonar.host.url=http://host.docker.internal:9000
            -Dsonar.login=$SONAR_TOKEN
            -Dsonar.language=terraform

      - name: Upload SonarQube results to artifact
        uses: actions/upload-artifact@v3
        with:
          name: sonar-results
          path: .scannerwork/scan-results.txt

