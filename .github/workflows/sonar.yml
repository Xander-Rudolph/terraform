name: SonarQube Scan with Local Server

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  review-pr:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:latest
        ports:
          - 9000:9000
        #TODO: this page works on the pod, but itsn't passing the github healthcheck
        # options: >-
        #   --health-cmd="curl -f http://localhost:9000/api/system/health"
        #   --health-interval=30s
        #   --health-timeout=10s
        #   --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for SonarQube to be ready
        run: |
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            echo "Waiting for SonarQube to start..."
            sleep 10
          done

      - name: Run SonarQube Scanner
        env:
          COVERAGE_ENABLED: 'true' # Set to 'false' to disable code coverage
        run: |
          docker run \
            --rm \
            --name sonarsource \
            -e SONAR_HOST_URL="http://localhost:9000" \
            -e COVERAGE_ENABLED="${{ env.COVERAGE_ENABLED }}" \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=my-project-key \
            -Dsonar.sources=. \
            -Dsonar.host.url="http://localhost:9000" \
            ${COVERAGE_ENABLED:+'-Dsonar.coverage.exclusions=**/*'} \
            -Dsonar.language=terraform

      - name: Save scan results
        run: |
          mkdir -p .scannerwork
          docker cp sonarsource:/usr/src/.scannerwork/report-task.txt ./.scannerwork/scan-results.txt

      - name: Upload SonarQube results to artifact
        uses: actions/upload-artifact@v3
        with:
          name: sonar-results
          path: .scannerwork/scan-results.txt

