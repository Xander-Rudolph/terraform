name: SonarQube PR Review

on:
  push:
    branches:
        - main
  pull_request:
    types: [opened, synchronize]

jobs:
  review-pr:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:latest
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/api/system/health" 
          --health-interval=30s 
          --health-timeout=10s 
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for SonarQube to be ready
        shell: pwsh
        run: |
          Write-Host "Waiting for SonarQube to be ready..."
          while (-not (Invoke-WebRequest -Uri "http://localhost:9000/api/system/health" -UseBasicParsing)) {
            Start-Sleep -Seconds 5
            Write-Host "."
          }
          Write-Host "SonarQube is ready."

    #TODO: Add sonar installer and source path input

      - name: Run SonarQube Analysis
        shell: pwsh
        run: |
          $env:SONAR_SCANNER_OPTS = "-Dsonar.login=admin -Dsonar.password=admin"
          sonar-scanner `
            -Dsonar.projectKey=${{ github.repository }} `
            -Dsonar.sources=${{ inputs.sourcePath }} `
            -Dsonar.host.url=http://localhost:9000 `
            -Dsonar.pullrequest.key=${{ github.event.number }} `
            -Dsonar.pullrequest.branch=${{ github.head_ref }} `
            -Dsonar.pullrequest.base=${{ github.base_ref }}

      - name: Generate SonarQube Report
        shell: pwsh
        run: |
          $sonar_url = "http://localhost:9000"
          $project_key = "$env:GITHUB_REPOSITORY"
          $response = Invoke-RestMethod -Uri "$sonar_url/api/measures/component_tree?component=$project_key&metricKeys=coverage"
          $coverage = $response.components | ForEach-Object { $_.measures | Where-Object { $_.metric -eq 'coverage' } | Select-Object -ExpandProperty value }

          $md_content = @"
          # SonarQube Analysis Report

          **Project Key:** $project_key
          **Coverage:** $coverage%
          "@

          $md_content | Out-File -FilePath report.md -Encoding utf8

      - name: Setup GitHub Pages Branch
        shell: pwsh
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git fetch
          git checkout gh-pages || git checkout --orphan gh-pages
          git reset --hard
          rm -rf *
          cp ../report.md .
          git add report.md
          git commit -m "Update SonarQube report for PR #${{ github.event.number }}"
          git push origin gh-pages --force